# Render Blueprint for the Phantom Query backend.
# The frontend stays on Cloudflare Pages; the app database stays on Neon.
#
# No rootDir on purpose: with rootDir set, Render resolved dockerContext
# relative to it (backend/backend, build failed). Without rootDir, both
# paths are plainly relative to the repo root. buildFilter does the other
# job rootDir did: only backend changes trigger a backend deploy.
services:
  - type: web
    name: phantom-query-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
    # Pick the region closest to your Neon database. Every query makes
    # several round trips to Neon, so cross-ocean latency adds up fast.
    # Cannot be changed after the service is created.
    region: frankfurt
    # "free" spins down after ~15 min idle and cold-starts on the next
    # request (tens of seconds). Fine for testing; for a demo link you
    # hand to recruiters, switch to a paid plan (e.g. 0.5c-512mb).
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://phantom-query.pages.dev
      # Secrets: Render prompts for these once, when the Blueprint is
      # first created. Copy them EXACTLY from Railway -- especially
      # CREDENTIAL_ENCRYPTION_KEY (see README, Deployment).
      - key: APP_DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
